name: Package upstream CKBadger v0.8.3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/package-v0.8.3.yml'
      - 'scripts/package-v0.8.3.sh'
      - 'docs/package-v0.8.3.md'

permissions:
  contents: read

jobs:
  package:
    name: Build and test upstream v0.8.3 (Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # This checkout supplies the recipe and smoke-test driver, not CKBadger source.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libssl-dev zlib1g-dev
          rustup toolchain install stable --profile minimal
          npm install --global pnpm@9.15.0

      - name: Build, smoke-test, and export Docker image
        run: bash scripts/package-v0.8.3.sh "$RUNNER_TEMP/package-v0.8.3"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ckbadger-v0.8.3-linux-amd64
          path: ${{ runner.temp }}/package-v0.8.3/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
